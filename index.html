<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fabio — Short-form content & ads die leads opleveren</title>
<meta name="description" content="Videograaf in Eindhoven. Paid ads, organische short-form, UGC, podcast- en testimonial-edits voor merken en ondernemers. Gewerkt voor Boxbollen, Qbuzz, The High Value Club en Bij Albrecht." />
<style>
  :root{
    --bg:#0a0a0c;
    --bg-soft:#111116;
    --card:#16161c;
    --text:#f4f4f6;
    --muted:#9a9aa6;
    --line:rgba(255,255,255,.08);
    --accent:#ff5d3b;
    --accent2:#ffb23b;
    --wa:#25d366;
    --radius:18px;
    --maxw:1240px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    line-height:1.5;
    overflow-x:hidden;
  }
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  /* ---------- BUTTONS ---------- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    padding:14px 24px;border-radius:999px;font-weight:700;font-size:15px;
    transition:transform .2s,box-shadow .2s,background .2s;white-space:nowrap;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn-wa{background:var(--wa);color:#05210f;box-shadow:0 10px 30px -10px rgba(37,211,102,.55)}
  .btn-ghost{border:1px solid rgba(255,255,255,.18);color:var(--text)}
  .btn-ghost:hover{background:rgba(255,255,255,.06)}
  .btn svg{flex:none}

  /* ---------- NAV ---------- */
  .nav{
    position:sticky;top:0;z-index:50;
    backdrop-filter:saturate(160%) blur(14px);
    background:rgba(10,10,12,.72);
    border-bottom:1px solid var(--line);
  }
  .nav-inner{
    max-width:var(--maxw);margin:0 auto;padding:14px 24px;
    display:flex;align-items:center;justify-content:space-between;gap:20px;
  }
  .brand{font-weight:800;letter-spacing:.04em;font-size:15px}
  .brand span{color:var(--accent)}
  .nav-links{display:flex;gap:4px;align-items:center}
  .nav-links a{
    font-size:13px;color:var(--muted);padding:8px 12px;border-radius:999px;
    transition:.2s;white-space:nowrap;font-weight:500;
  }
  .nav-links a:hover{color:var(--text);background:rgba(255,255,255,.06)}
  .lang{
    display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;margin-left:8px;
  }
  .lang button{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;color:var(--muted)}
  .lang button.on{background:rgba(255,255,255,.1);color:var(--text)}
  @media (max-width:820px){ .nav-links a{display:none} .nav-inner{padding:12px 16px} }

  /* ---------- HERO ---------- */
  .hero{
    max-width:var(--maxw);margin:0 auto;padding:84px 24px 56px;
    display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;position:relative;
  }
  .eyebrow{
    color:var(--accent);font-size:12.5px;font-weight:700;letter-spacing:.2em;
    text-transform:uppercase;margin-bottom:20px;
  }
  .hero h1{
    font-size:clamp(36px,5.6vw,68px);line-height:1.03;font-weight:800;letter-spacing:-.025em;
  }
  .hero h1 em{
    font-style:normal;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero p.lead{max-width:520px;margin-top:22px;color:var(--muted);font-size:17px}
  .hero .ctas{display:flex;gap:12px;margin-top:32px;flex-wrap:wrap}
  .stats{display:flex;gap:36px;margin-top:40px;flex-wrap:wrap}
  .stat .n{font-size:26px;font-weight:800;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .stat .l{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:2px}

  .reel{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-items:center}
  .reel video{
    width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:16px;background:#000;
    border:1px solid var(--line);
  }
  .reel video:nth-child(2){transform:translateY(-28px)}
  .glow{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
  .glow::before{
    content:"";position:absolute;top:-180px;left:30%;
    width:720px;height:560px;border-radius:50%;
    background:radial-gradient(closest-side,rgba(255,93,59,.24),transparent 70%);
    filter:blur(20px);
  }
  @media (max-width:900px){
    .hero{grid-template-columns:1fr;padding:56px 16px 40px;gap:36px}
    .reel video:nth-child(2){transform:none}
  }

  /* ---------- CLIENT STRIP ---------- */
  .clients{border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--bg-soft)}
  .clients-inner{
    max-width:var(--maxw);margin:0 auto;padding:22px 24px;
    display:flex;align-items:center;gap:20px 40px;flex-wrap:wrap;justify-content:center;
  }
  .clients .label{font-size:12px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
  .clients .name{font-size:clamp(16px,2.2vw,22px);font-weight:800;letter-spacing:-.01em;color:#d8d8e0}
  .clients .ugc-row{border-top:1px solid var(--line);padding-top:16px;padding-bottom:18px;gap:12px 28px}
  .clients .ugc-row .name{font-size:clamp(13px,1.5vw,16px);font-weight:700;color:var(--muted)}

  /* ---------- SECTIONS ---------- */
  .section{max-width:var(--maxw);margin:0 auto;padding:72px 24px}
  @media (max-width:820px){ .section{padding:52px 16px} .clients-inner{padding:18px 16px} }
  .sec-head{display:flex;align-items:baseline;gap:16px;margin-bottom:30px;flex-wrap:wrap}
  .sec-head h2{font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-.015em}
  .sec-head .idx{color:var(--accent);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
  .sec-head .desc{color:var(--muted);font-size:15px;margin-left:auto;max-width:440px;text-align:right}
  @media (max-width:820px){ .sec-head .desc{margin-left:0;text-align:left} }

  /* services */
  .services{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
  .service{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
  .service .ic{font-size:22px;margin-bottom:14px}
  .service h3{font-size:17px;font-weight:700;margin-bottom:6px}
  .service p{color:var(--muted);font-size:14.5px}

  /* case studies */
  .cases{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
  .case{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;display:flex;flex-direction:column;
  }
  .case .media{position:relative;background:#000;cursor:pointer}
  .case .media video{display:block;width:100%;aspect-ratio:4/5;object-fit:cover}
  .case .body{padding:22px;display:flex;flex-direction:column;gap:12px;flex:1}
  .case .client{font-size:20px;font-weight:800}
  .case .tags{display:flex;gap:6px;flex-wrap:wrap}
  .case .tags span{font-size:11.5px;color:var(--muted);border:1px solid var(--line);padding:3px 9px;border-radius:999px}
  .case dl{display:grid;gap:10px}
  .case dt{font-size:11.5px;color:var(--accent);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
  .case dd{font-size:14.5px;color:#d4d4dc}
  .case .result{
    margin-top:auto;padding:12px 14px;border-radius:12px;
    background:rgba(255,93,59,.08);border:1px solid rgba(255,93,59,.25);font-weight:600;font-size:14.5px;
  }

  /* work grid */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
  .filters button{
    font-size:13px;font-weight:600;padding:8px 14px;border-radius:999px;
    border:1px solid var(--line);color:var(--muted);transition:.2s;
  }
  .filters button:hover{color:var(--text)}
  .filters button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));grid-auto-flow:dense}
  .grid .card.wide{grid-column:span 2}
  @media (max-width:540px){ .grid{grid-template-columns:1fr 1fr;gap:10px} .grid .card.wide{grid-column:span 2} }
  .card{
    position:relative;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);overflow:hidden;cursor:pointer;
    transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
  }
  .card:hover{transform:translateY(-4px);border-color:rgba(255,93,59,.45);box-shadow:0 18px 40px -18px rgba(0,0,0,.8)}
  .card video{display:block;width:100%;height:100%;background:#000;aspect-ratio:9/16;object-fit:cover}
  .card.wide video{aspect-ratio:16/9}
  .card.hide{display:none}
  .meta{
    position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;
    background:linear-gradient(180deg,transparent,rgba(0,0,0,.85));pointer-events:none;
    transition:opacity .25s;
  }
  .meta .title{font-size:13.5px;font-weight:700;display:block}
  .meta .sub{font-size:12px;color:#c4c4cc}
  .play{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    transition:opacity .25s;pointer-events:none;
  }
  .play .pbtn{
    width:52px;height:52px;border-radius:50%;
    background:rgba(255,255,255,.14);backdrop-filter:blur(6px);
    border:1px solid rgba(255,255,255,.35);
    display:flex;align-items:center;justify-content:center;
  }
  .play .pbtn svg{margin-left:3px}
  .playing .play,.playing .meta{opacity:0}

  /* packages */
  .packages{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
  .pkg{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:28px;display:flex;flex-direction:column;gap:14px}
  .pkg.hot{border-color:rgba(255,93,59,.55);box-shadow:0 0 0 1px rgba(255,93,59,.25) inset}
  .pkg .name{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .pkg .price{font-size:30px;font-weight:800;letter-spacing:-.02em}
  .pkg .price small{font-size:14px;color:var(--muted);font-weight:500}
  .pkg ul{list-style:none;display:grid;gap:8px;font-size:14.5px;color:#d4d4dc}
  .pkg li::before{content:"✓";color:var(--accent);font-weight:800;margin-right:10px}
  .pkg .btn{margin-top:auto}
  .note{color:var(--muted);font-size:14px;margin-top:18px}

  /* process */
  .steps{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));counter-reset:s}
  .step{border-top:2px solid var(--accent);padding-top:18px}
  .step::before{counter-increment:s;content:"0" counter(s);font-weight:800;color:var(--accent);font-size:14px}
  .step h3{font-size:18px;margin:6px 0}
  .step p{color:var(--muted);font-size:14.5px}

  /* contact */
  .contact{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
  @media (max-width:900px){ .contact{grid-template-columns:1fr} }
  .contact h2{font-size:clamp(28px,4.4vw,46px);font-weight:800;letter-spacing:-.02em;line-height:1.08}
  .contact p{color:var(--muted);margin:16px 0 26px;font-size:16px}
  form{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;display:grid;gap:14px}
  form .ttl{font-weight:700}
  label{display:grid;gap:6px;font-size:13px;color:var(--muted);font-weight:600}
  input,select,textarea{
    font:inherit;font-size:15px;color:var(--text);background:var(--bg);
    border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:12px 14px;width:100%;
  }
  input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
  textarea{min-height:96px;resize:vertical}
  .hp{position:absolute;left:-9999px}
  .submit{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#1a0d06}
  .thanks{display:none;background:rgba(37,211,102,.1);border:1px solid rgba(37,211,102,.4);border-radius:12px;padding:12px 14px;font-weight:600}
  .thanks.show{display:block}

  /* floating whatsapp */
  .wa-float{
    position:fixed;right:18px;bottom:18px;z-index:60;width:58px;height:58px;border-radius:50%;
    background:var(--wa);display:flex;align-items:center;justify-content:center;
    box-shadow:0 12px 30px -8px rgba(0,0,0,.6);transition:transform .2s;
  }
  .wa-float:hover{transform:scale(1.06)}

  footer{
    max-width:var(--maxw);margin:0 auto;padding:36px 24px 100px;
    border-top:1px solid var(--line);color:var(--muted);font-size:13px;
    display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap;
  }
  footer a:hover{color:var(--text)}
</style>
</head>

  const PLAY_SVG = '<svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>';

  const src = f => encodeURI("assets/" + f);
  // Each video has a poster frame next to it with the same name and a .jpg extension.
  const poster = f => encodeURI("assets/" + f.replace(/\.[^.]+$/, ".jpg"));

  let lang = "nl";
  try { const saved = localStorage.getItem("lang"); if (saved === "nl" || saved === "en") lang = saved; } catch(e){}
  const t = k => T[lang][k] ?? T.nl[k] ?? "";

  /* ---------- lazy video loading ---------- */
  const lazy = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      const v = e.target;
      if (v.dataset.src) { v.src = v.dataset.src; delete v.dataset.src; }
      if (v.dataset.autoplay) v.play().catch(()=>{});
      lazy.unobserve(v);
    });
  }, { rootMargin:"300px" });

  function makeVideo(file, { autoplay=false } = {}){
    const v = document.createElement("video");
    v.muted = true; v.loop = true; v.playsInline = true;
    v.setAttribute("playsinline", "");
    v.preload = "metadata";
    v.poster = poster(file);
    v.dataset.src = src(file);
    if (autoplay) v.dataset.autoplay = "1";
    lazy.observe(v);
    return v;
  }

  /* ---------- click-to-play behaviour, shared by work cards and case media ---------- */
  let activeVideo = null;
  function stop(v){
    v.pause(); v.controls = false; v.muted = true; v.loop = true;
    v.parentElement.classList.remove("playing");
  }
  function attachPlayer(wrap, v){
    wrap.addEventListener("mouseenter", () => { if (!wrap.classList.contains("playing")) v.play().catch(()=>{}); });
    wrap.addEventListener("mouseleave", () => { if (!wrap.classList.contains("playing")) v.pause(); });
    wrap.addEventListener("click", () => {
      if (activeVideo && activeVideo !== v) stop(activeVideo);
      if (wrap.classList.contains("playing")) { stop(v); activeVideo = null; return; }
      wrap.classList.add("playing");
      v.muted = false; v.controls = true; v.loop = false;
      v.play().catch(()=>{});
      activeVideo = v;
    });
  }

  /* ---------- render ---------- */
  function renderReel(){
    const reel = document.getElementById("reel");
    reel.innerHTML = "";
    REEL.forEach(w => reel.appendChild(makeVideo(w.file, { autoplay:true })));
  }

  function renderServices(){
    document.getElementById("services-list").innerHTML = SERVICES.map(s => `
      <div class="service"><div class="ic">${s.ic}</div>
        <h3>${t(`svc.${s.key}.t`)}</h3><p>${t(`svc.${s.key}.d`)}</p></div>`).join("");
  }

  function renderCases(){
    const list = document.getElementById("cases-list");
    list.innerHTML = "";
    CASES.forEach(c => {
      const el = document.createElement("article");
      el.className = "case";
      const result = t(`case.${c.key}.result`);
      el.innerHTML = `
        ${c.file ? `<div class="media"><div class="play"><div class="pbtn">${PLAY_SVG}</div></div></div>` : ""}
        <div class="body">
          <div class="client">${c.client}</div>
          <div class="tags">${c.tags.map(x => `<span>${t("filter." + x)}</span>`).join("")}</div>
          <dl>
            <div><dt>${t("case.need")}</dt><dd>${t(`case.${c.key}.need`)}</dd></div>
            <div><dt>${t("case.made")}</dt><dd>${t(`case.${c.key}.made`)}</dd></div>
          </dl>
          ${result ? `<div class="result">${result}</div>` : ""}
        </div>`;
      if (c.file) {
        const media = el.querySelector(".media");
        const v = makeVideo(c.file);
        media.prepend(v);
        attachPlayer(media, v);
      }
      list.appendChild(el);
    });
  }

  let filter = "all";
  function renderFilters(){
    const used = ["all", ...new Set(WORK.map(w => w.tag))];
    document.getElementById("filters").innerHTML = used.map(k =>
      `<button type="button" data-f="${k}" class="${k === filter ? "on" : ""}">${t("filter." + k)}</button>`).join("");
  }
  function applyFilter(){
    document.querySelectorAll("#grid .card").forEach(c =>
      c.classList.toggle("hide", filter !== "all" && c.dataset.tag !== filter));
    document.querySelectorAll("#filters button").forEach(b => b.classList.toggle("on", b.dataset.f === filter));
  }
  document.getElementById("filters").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    filter = b.dataset.f;
    if (activeVideo) { stop(activeVideo); activeVideo = null; }
    applyFilter();
  });

  function renderGrid(){
    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    WORK.forEach(w => {
      const card = document.createElement("div");
      card.className = "card" + (w.wide ? " wide" : "");
      card.dataset.tag = w.tag;
      card.innerHTML = `
        <div class="play"><div class="pbtn">${PLAY_SVG}</div></div>
        <div class="meta"><span class="title">${w.title}</span><span class="sub">${w.client}</span></div>`;
      const v = makeVideo(w.file);
      card.prepend(v);
      attachPlayer(card, v);
      grid.appendChild(card);
    });
    applyFilter();
  }

  function renderPackages(){
    document.getElementById("pkg-list").innerHTML = ["pilot","growth","premium"].map(k => `
      <div class="pkg ${k === "growth" ? "hot" : ""}">
        <div class="name">${t(`pkg.${k}.n`)}</div>
        <div class="price">${t(`pkg.${k}.p`)} <small>${t(`pkg.${k}.s`)}</small></div>

        <a class="btn btn-ghost js-wa" target="_blank" rel="noopener">${t("pkg.cta")}</a>
      </div>`).join("");
  }

  function renderSteps(){
    document.getElementById("steps").innerHTML = [1,2,3].map(n => `
      <div class="step"><h3>${t(`step${n}.t`)}</h3><p>${t(`step${n}.d`)}</p></div>`).join("");
  }

  function applyText(){
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
    document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
    const waHref = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(t("wa.msg"))}`;
    document.querySelectorAll(".js-wa").forEach(a => a.href = waHref);
    document.querySelectorAll(".wa-ic").forEach(s => s.innerHTML = WA_SVG);
  }

  function render(){
    renderServices(); renderCases(); renderFilters(); renderPackages(); renderSteps();
    applyText(); applyFilter();
  }

  document.querySelector(".lang").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    lang = b.dataset.lang;
    try { localStorage.setItem("lang", lang); } catch(e){}
    render();
  });

  /* ---------- form: submit in the background, show a thank-you ---------- */
  document.getElementById("lead-form").addEventListener("submit", async e => {
    e.preventDefault();
    const form = e.target;
    const btn = form.querySelector(".submit");
    btn.disabled = true;
    try {
      const res = await fetch(form.action.replace("formsubmit.co/", "formsubmit.co/ajax/"), {
        method:"POST", headers:{ Accept:"application/json" }, body:new FormData(form),
      });
      if (!res.ok) throw new Error(res.status);
      form.reset();
      document.getElementById("thanks").classList.add("show");
    } catch(err) {
      form.submit(); // fall back to a normal post
    } finally {
      btn.disabled = false;
    }
  });

  renderReel(); renderGrid(); render();
  document.getElementById("yr").textContent = new Date().getFullYear();
</script>
